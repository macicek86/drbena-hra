name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build:pages
        env:
          CF_PAGES: "1"
          # Žebříček a výsledky ukládá redakce Kopidlenské drbny do D1 (repozitář kopidlenska-drbna, src/hra/).
          VITE_PLAYS_URL: https://www.kopidlenskadrbna.org/hra/api
      - name: Deploy hra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create hra --production-branch main || true
          npx --yes wrangler@4 pages deploy pages-dist --project-name=hra --branch=main --commit-dirty=true
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/hra/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"hra.kopidlenskadrbna.org"}' || true
